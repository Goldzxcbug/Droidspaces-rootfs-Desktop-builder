name: Droidspaces RootFS 核心构建

on:
  workflow_call:
    inputs:
      ui_language:
        required: false
        type: string
        default: zh
      build_target:
        required: true
        type: string
      custom_username:
        required: false
        type: string
        default: Gold
      desktop:
        required: true
        type: string
      extra_desktops:
        required: false
        type: string
        default: ''
      desktop_autostart:
        required: true
        type: boolean
      display_backend:
        required: true
        type: string
      PulseAudio:
        required: true
        type: string
      enable_zh_tz:
        required: true
        type: boolean
      enable_mesa:
        required: true
        type: boolean
      enable_8gen2_wayland:
        required: true
        type: boolean
      nosnap:
        required: true
        type: boolean
      enable_systemd257:
        required: true
        type: boolean
      enable_srf:
        required: true
        type: boolean
      enable_binfmt:
        required: true
        type: boolean
      enable_yj:
        required: true
        type: boolean
      enable_kfgj:
        required: true
        type: boolean
      enable_zip:
        required: true
        type: boolean
      enable_docker:
        required: true
        type: boolean
      wayland_package_repository:
        required: false
        type: string
        default: Goldzxcbug/droidspaces-package
      build_id:
        required: false
        type: string
        default: ''
      asset_variant:
        required: false
        type: string
        default: ''
      publish_release:
        required: false
        type: boolean
        default: true

jobs:
  # --------------------------------------------------------
  # Phase 1: setup (Environment preparation and variable generation)
  # --------------------------------------------------------
  setup:
    name: ${{ inputs.ui_language == 'zh' && '准备构建' || 'Setup' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find-templates.outputs.matrix }}
      desktop: ${{ steps.find-templates.outputs.desktop }}
      desktop_autostart: ${{ steps.find-templates.outputs.desktop_autostart }}
      display_backend: ${{ steps.find-templates.outputs.display_backend }}
      pulseaudio_effective: ${{ steps.find-templates.outputs.pulseaudio_effective }}
      build_id: ${{ steps.prep.outputs.build_id }}
      build_date: ${{ steps.prep.outputs.build_date }}
    steps:
      - name: ${{ inputs.ui_language == 'zh' && '检出仓库' || 'Checkout repository' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: ${{ inputs.ui_language == 'zh' && '解析构建选项' || 'Parse user build choices' }}
        id: find-templates
        env:
          BUILD_TARGET_INPUT: ${{ inputs.build_target }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP_AUTOSTART_INPUT: ${{ inputs.desktop_autostart }}
          DESKTOP_INPUT: ${{ inputs.desktop }}
          EXTRA_DESKTOPS_INPUT: ${{ inputs.extra_desktops }}
          DISPLAY_BACKEND_INPUT: ${{ inputs.display_backend }}
          ENABLE_SYSTEMD257_INPUT: ${{ inputs.enable_systemd257 }}
          PULSEAUDIO_INPUT: ${{ inputs.PulseAudio }}
          UI_LANGUAGE: ${{ inputs.ui_language }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          PUBLISH_ALL_WAYLAND: ${{ inputs.desktop == 'all-wayland' }}
        run: |
          set -euo pipefail
          source scripts/lib/desktop-config.sh

          case "$UI_LANGUAGE" in
            zh|en) ;;
            *)
              echo "不支持的界面语言 / Unsupported UI language: $UI_LANGUAGE" >&2
              exit 1
              ;;
          esac

          message() {
            if [ "$UI_LANGUAGE" = zh ]; then
              printf '%s\n' "$1"
            else
              printf '%s\n' "$2"
            fi
          }

          fail() {
            message "$1" "$2" >&2
            exit 1
          }

          TARGET="$BUILD_TARGET_INPUT"

          # ---------- validations that don't depend on the desktop ----------
          if [ "$ENABLE_SYSTEMD257_INPUT" = "true" ] && [ "$TARGET" = "all-wayland" ]; then
            fail "all-wayland 构建不支持 systemd 257 兼容选项。" \
              "all-wayland builds do not support the systemd 257 compatibility option."
          fi
          if [[ ! "$WAYLAND_PACKAGE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            fail "Wayland 软件包仓库必须使用公开的“所有者/仓库名”格式。" \
              "Wayland package repository must use the public owner/repository format."
          fi
          if [[ ! "$CUSTOM_USERNAME" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]; then
            fail "自定义用户名必须是 1 至 32 个字符的有效 Linux 用户名。" \
              "Custom username must be a 1-32 character Linux username."
          fi

          # ---------- build the (deduplicated) desktop list ----------
          DESKTOPS=()
          add_desktop() {
            local d="$1" x
            for x in "${DESKTOPS[@]}"; do
              [ "$x" = "$d" ] && return 0
            done
            DESKTOPS+=("$d")
          }

          # trim leading/trailing whitespace and stray quotes (no xargs:
          # xargs treats quotes specially and fails hard on unbalanced ones)
          trim_value() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            case "$v" in
              \'*\'|\"*\") v="${v:1:${#v}-2}" ;;
            esac
            v="${v//\'/}"
            v="${v//\"/}"
            printf '%s\n' "$v"
          }

          # accept full-width commas from Chinese IME input
          EXTRA_DESKTOPS_NORMALIZED="$(trim_value "${EXTRA_DESKTOPS_INPUT//$'\xef\xbc\x8c'/,}")"

          if [ "$PUBLISH_ALL_WAYLAND" = "true" ]; then
            add_desktop "all-wayland"
            if [ -n "$EXTRA_DESKTOPS_NORMALIZED" ]; then
              message "已选择 all-wayland 构建目标，额外的桌面参数“$EXTRA_DESKTOPS_INPUT”会被忽略。" \
                "all-wayland target selected; the extra desktops value \"$EXTRA_DESKTOPS_INPUT\" is ignored."
            fi
          else
            PRIMARY_INPUT="$(trim_value "$DESKTOP_INPUT")"
            PRIMARY="$(desktop_normalize "$PRIMARY_INPUT")" || {
              fail "无效的桌面环境：$DESKTOP_INPUT" \
                "Invalid desktop: $DESKTOP_INPUT"
            }
            add_desktop "$PRIMARY"
            IFS=',' read -ra EXTRA <<< "$EXTRA_DESKTOPS_NORMALIZED"
            for raw in "${EXTRA[@]}"; do
              raw="$(trim_value "$raw")"
              [ -n "$raw" ] || continue
              d="$(desktop_normalize "$raw")" || {
                fail "无效的桌面环境：$raw" "Invalid desktop: $raw"
              }
              add_desktop "$d"
            done
            if [ "${#DESKTOPS[@]}" -gt 1 ]; then
              for d in "${DESKTOPS[@]}"; do
                [ "$d" != "none" ] || fail \
                  "none 不能和其他桌面环境同时选择。" \
                  "'none' cannot be combined with other desktops."
              done
            fi
          fi

          # ---------- per-desktop resolution -> matrix rows ----------
          MATRIX_FILE="$RUNNER_TEMP/rootfs-matrix.tsv"
          : > "$MATRIX_FILE"
          # columns: template, desktop, display_backend, autostart, pulseaudio
          emit() { printf '%s\t%s\t%s\t%s\t%s\n' "$@" >> "$MATRIX_FILE"; }

          for DESKTOP in "${DESKTOPS[@]}"; do
            if [ "$DESKTOP" = "none" ]; then
              DISPLAY_BACKEND="x11"
            elif [ "$DESKTOP" = "all-wayland" ]; then
              DISPLAY_BACKEND="anland-wayland"
            else
              DISPLAY_BACKEND="$(display_backend_normalize "$DISPLAY_BACKEND_INPUT")" || {
                fail "无效的显示后端：$DISPLAY_BACKEND_INPUT" \
                  "Invalid display backend: $DISPLAY_BACKEND_INPUT"
              }
            fi
            DESKTOP_AUTOSTART="$DESKTOP_AUTOSTART_INPUT"

            if [ "$ENABLE_SYSTEMD257_INPUT" = "true" ]; then
              case "$DESKTOP" in
                kde)
                  message "已启用 systemd 257：普通 KDE 位于验证支持白名单中。" \
                    "systemd 257 is enabled: standard KDE is on the verified support allowlist."
                  ;;
                none)
                  DISPLAY_BACKEND="x11"
                  DESKTOP_AUTOSTART="false"
                  ;;
                *)
                  message "systemd 257 尚不支持 $DESKTOP：强制使用 none 桌面并关闭桌面开机自启动。" \
                    "systemd 257 does not support $DESKTOP: forcing desktop=none and disabling desktop auto-start."
                  DESKTOP="none"
                  DISPLAY_BACKEND="x11"
                  DESKTOP_AUTOSTART="false"
                  ;;
              esac
            fi

            case "$DESKTOP" in
              kde-mobile|gnome|anland-next|niri|hyprland|mango|denial)
                DISPLAY_BACKEND="anland-wayland"
                ;;
            esac

            if [ "$DESKTOP" = "none" ] && [ "$DESKTOP_AUTOSTART" = "true" ]; then
              fail "未安装桌面时不能启用桌面开机自启动。" \
                "Desktop auto-start cannot be enabled when desktop is none."
            fi

            PULSE_AUDIO="$PULSEAUDIO_INPUT"
            if [ "$DISPLAY_BACKEND" = "anland-wayland" ]; then
              PULSE_AUDIO="none"
            fi

            if [ "$DESKTOP" = "all-wayland" ]; then
              [ "$TARGET" = "all-wayland" ] || fail \
                "完整 Wayland 桌面矩阵必须使用 all-wayland 构建目标。" \
                "The full Wayland desktop matrix requires the all-wayland target."
              while IFS= read -r wd; do
                while IFS= read -r candidate; do
                  emit "$candidate" "$wd" "anland-wayland" "$DESKTOP_AUTOSTART" "none"
                done < <(desktop_wayland_targets_json "$wd" | jq -r '.[]')
              done < <(printf '%s\n' kde kde-mobile gnome anland-next niri hyprland mango denial)
            else
              case "$TARGET" in
                all)
                  while IFS= read -r candidate; do
                    if desktop_backend_supported "$candidate" "$DESKTOP" "$DISPLAY_BACKEND"; then
                      emit "$candidate" "$DESKTOP" "$DISPLAY_BACKEND" "$DESKTOP_AUTOSTART" "$PULSE_AUDIO"
                    fi
                  done < <(for dockerfile in *.Dockerfile; do basename "${dockerfile%.Dockerfile}"; done | sort)
                  ;;
                all-wayland)
                  [ "$DESKTOP" != "none" ] || fail \
                    "all-wayland 需要选择一个桌面环境。" \
                    "all-wayland requires a desktop profile."
                  while IFS= read -r candidate; do
                    emit "$candidate" "$DESKTOP" "anland-wayland" "$DESKTOP_AUTOSTART" "none"
                  done < <(desktop_wayland_targets_json "$DESKTOP" | jq -r '.[]')
                  ;;
                *)
                  target_is_known "$TARGET" || fail \
                    "未知的构建目标：$TARGET" \
                    "Unknown build target: $TARGET"
                  desktop_backend_supported "$TARGET" "$DESKTOP" "$DISPLAY_BACKEND" || fail \
                    "不支持的发行版、桌面和显示后端组合：$TARGET/$DESKTOP/$DISPLAY_BACKEND" \
                    "Unsupported target/profile/backend: $TARGET/$DESKTOP/$DISPLAY_BACKEND"
                  emit "$TARGET" "$DESKTOP" "$DISPLAY_BACKEND" "$DESKTOP_AUTOSTART" "$PULSE_AUDIO"
                  ;;
              esac
            fi
          done

          # remove duplicate rows (e.g. several desktops downgraded to none by systemd257)
          awk '!seen[$0]++' "$MATRIX_FILE" > "$MATRIX_FILE.dedup"
          mv "$MATRIX_FILE.dedup" "$MATRIX_FILE"

          MATRIX="$(jq -c -Rn '[inputs | split("\t") | {template: .[0], desktop: .[1], display_backend: .[2], autostart: .[3], pulseaudio: .[4]}]' < "$MATRIX_FILE")"
          [ "$MATRIX" != "[]" ] || fail \
            "没有发行版支持所选的桌面/显示后端组合。" \
            "No target supports the selected desktop/backend combination."

          SUMMARY_DESKTOP="$(jq -r '[.[].desktop] | unique | join(", ")' <<< "$MATRIX")"
          SUMMARY_AUTOSTART="$(jq -r '[.[].autostart] | unique | join(", ")' <<< "$MATRIX")"
          SUMMARY_BACKEND="$(jq -r '[.[].display_backend] | unique | join(", ")' <<< "$MATRIX")"
          SUMMARY_PULSE="$(jq -r '[.[].pulseaudio] | unique | join(", ")' <<< "$MATRIX")"

          # human-readable variants for the release notes
          SUMMARY_DESKTOP_LABEL=""
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            label="$(desktop_label "$d" 2>/dev/null || printf '%s' "$d")"
            if [ -z "$SUMMARY_DESKTOP_LABEL" ]; then
              SUMMARY_DESKTOP_LABEL="$label"
            else
              SUMMARY_DESKTOP_LABEL="$SUMMARY_DESKTOP_LABEL, $label"
            fi
          done < <(jq -r '[.[].desktop] | unique | .[]' <<< "$MATRIX")

          SUMMARY_BACKEND_LABEL=""
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            label="$(display_backend_label "$b" 2>/dev/null || printf '%s' "$b")"
            if [ -z "$SUMMARY_BACKEND_LABEL" ]; then
              SUMMARY_BACKEND_LABEL="$label"
            else
              SUMMARY_BACKEND_LABEL="$SUMMARY_BACKEND_LABEL, $label"
            fi
          done < <(jq -r '[.[].display_backend] | unique | .[]' <<< "$MATRIX")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "desktop=$SUMMARY_DESKTOP" >> "$GITHUB_OUTPUT"
          echo "desktop_autostart=$SUMMARY_AUTOSTART" >> "$GITHUB_OUTPUT"
          echo "display_backend=$SUMMARY_BACKEND" >> "$GITHUB_OUTPUT"
          echo "pulseaudio_effective=$SUMMARY_PULSE" >> "$GITHUB_OUTPUT"
          message "最终构建矩阵：$MATRIX" "Final decided build matrix: $MATRIX"
          message "桌面环境：$SUMMARY_DESKTOP_LABEL" "Desktop profiles: $SUMMARY_DESKTOP_LABEL"
          message "桌面开机自启动：$SUMMARY_AUTOSTART" "Desktop auto-start: $SUMMARY_AUTOSTART"
          message "显示后端：$SUMMARY_BACKEND_LABEL" "Display backends: $SUMMARY_BACKEND_LABEL"
          message "Wayland 软件包仓库：$WAYLAND_PACKAGE_REPOSITORY" \
            "Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY"
          message "最终 PulseAudio 设置：$SUMMARY_PULSE" "Final PulseAudio value: $SUMMARY_PULSE"

      - name: ${{ inputs.ui_language == 'zh' && '生成构建信息' || 'Prepare build metadata' }}
        id: prep
        env:
          UI_LANGUAGE: ${{ inputs.ui_language }}
          BUILD_ID_INPUT: ${{ inputs.build_id }}
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          BUILD_ID="${BUILD_ID_INPUT:-v$(date +'%Y%m%d-%H%M%S')}"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          if [ "$UI_LANGUAGE" = zh ]; then
            echo "构建 ID：$BUILD_ID"
          else
            echo "Build ID: $BUILD_ID"
          fi

  # --------------------------------------------------------
  # Phase 2: build (Build of regular Linux distribution RootFS)
  # --------------------------------------------------------
  build:
    name: ${{ inputs.ui_language == 'zh' && format('构建 {0}/{1}', matrix.template, matrix.desktop) || format('Build {0}/{1}', matrix.template, matrix.desktop) }}
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: ${{ inputs.ui_language == 'zh' && '检出仓库' || 'Checkout repository' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: ${{ inputs.ui_language == 'zh' && format('构建根文件系统（{0}/{1}）', matrix.template, matrix.desktop) || format('Build RootFS ({0}/{1})', matrix.template, matrix.desktop) }}
        env:
          ANLAND_RELEASE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
        run: |
          chmod +x build_rootfs-native.sh
          ./build_rootfs-native.sh \
            -i "${{ matrix.template }}.Dockerfile" \
            -v "${{ needs.setup.outputs.build_id }}${{ inputs.asset_variant != '' && format('-{0}', inputs.asset_variant) || '' }}" \
            -K "${{ matrix.desktop }}" \
            -L "${{ matrix.autostart }}" \
            -B "${{ matrix.display_backend }}" \
            -P "${{ matrix.pulseaudio }}" \
            -g "${{ inputs.enable_zh_tz }}" \
            -a "${{ inputs.enable_binfmt }}" \
            -b "${{ inputs.enable_yj }}" \
            -c "${{ inputs.enable_mesa }}" \
            -d "${{ inputs.enable_kfgj }}" \
            -e "${{ inputs.enable_zip }}" \
            -f "${{ inputs.enable_docker }}" \
            -h "${{ inputs.enable_srf }}" \
            -n "${{ inputs.nosnap }}" \
            -S "${{ inputs.enable_systemd257 }}" \
            -t "${{ inputs.enable_8gen2_wayland }}" \
            -u "$CUSTOM_USERNAME"

      - name: ${{ inputs.ui_language == 'zh' && '上传构建产物' || 'Upload build artifacts' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.template }}-${{ matrix.desktop }}-${{ inputs.asset_variant }}-rootfs
          path: "*.tar.xz"
          retention-days: 1

  # --------------------------------------------------------
  # Phase 3: release (Summary and release)
  # --------------------------------------------------------
  release:
    name: ${{ inputs.ui_language == 'zh' && '发布构建结果' || 'Publish build results' }}
    needs: [setup, build]
    if: ${{ inputs.publish_release && !cancelled() && needs.setup.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ${{ inputs.ui_language == 'zh' && '检出仓库' || 'Checkout repository' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: ${{ inputs.ui_language == 'zh' && '下载全部构建产物' || 'Download all artifacts' }}
        uses: actions/download-artifact@v7
        with:
          pattern: "*-rootfs"
          merge-multiple: true

      - name: ${{ inputs.ui_language == 'zh' && '整理发布文件' || 'Organize release files' }}
        run: |
          mkdir -p release_assets
          mv *.tar.xz release_assets/

      - name: ${{ inputs.ui_language == 'zh' && '生成发布说明' || 'Prepare Release notes' }}
        env:
          UI_LANGUAGE: ${{ inputs.ui_language }}
          BUILD_TIME: ${{ needs.setup.outputs.build_date }}
          BUILD_TARGET: ${{ inputs.build_target }}
          BUILD_ID: ${{ needs.setup.outputs.build_id }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP: ${{ needs.setup.outputs.desktop }}
          DESKTOP_AUTOSTART: ${{ needs.setup.outputs.desktop_autostart }}
          DISPLAY_BACKEND: ${{ needs.setup.outputs.display_backend }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          PULSE_AUDIO: ${{ needs.setup.outputs.pulseaudio_effective }}
          ENABLE_NOSNAP: ${{ inputs.nosnap }}
          ENABLE_SYSTEMD257: ${{ inputs.enable_systemd257 }}
          ENABLE_ZH_TZ: ${{ inputs.enable_zh_tz }}
          ENABLE_MESA: ${{ inputs.enable_mesa }}
          ENABLE_8GEN2_WAYLAND: ${{ inputs.enable_8gen2_wayland }}
          ENABLE_FCITX5: ${{ inputs.enable_srf }}
          ENABLE_BINFMT: ${{ inputs.enable_binfmt }}
          ENABLE_HARDWARE: ${{ inputs.enable_yj }}
          ENABLE_DEV_TOOLS: ${{ inputs.enable_kfgj }}
          ENABLE_COMPRESSION: ${{ inputs.enable_zip }}
          ENABLE_DOCKER: ${{ inputs.enable_docker }}
        run: |
          set -euo pipefail
          if [ "$UI_LANGUAGE" = zh ]; then
            cat > release-notes.md <<EOF
          Droidspaces 根文件系统自动构建
          构建时间：$BUILD_TIME
          构建目标：$BUILD_TARGET
          构建 ID：$BUILD_ID

          构建选项：
          - **自定义用户名**：$CUSTOM_USERNAME
          - **桌面环境**：$DESKTOP
          - **桌面开机自启动**：$DESKTOP_AUTOSTART
          - **显示后端**：$DISPLAY_BACKEND
          - Wayland 软件包仓库：$WAYLAND_PACKAGE_REPOSITORY
          - PulseAudio 音频转发：$PULSE_AUDIO
          - Anland 音频说明：Wayland 模式使用 Anland 应用内置音频，无需 PulseAudio
          - 移除 Ubuntu Snap：$ENABLE_NOSNAP
          - systemd 257 旧内核兼容：$ENABLE_SYSTEMD257
          - 使用中文并设置上海时区：$ENABLE_ZH_TZ
          - 高通骁龙 GPU 支持：$ENABLE_MESA
          - 修复骁龙 8 Gen 2 Wayland 显示异常：$ENABLE_8GEN2_WAYLAND
          - Fcitx 5 输入法支持：$ENABLE_FCITX5
          - 跨架构支持：$ENABLE_BINFMT
          - 容器硬件和网络识别：$ENABLE_HARDWARE
          - 开发工具：$ENABLE_DEV_TOOLS
          - 压缩工具：$ENABLE_COMPRESSION
          - Docker：$ENABLE_DOCKER
          EOF
          else
            cat > release-notes.md <<EOF
          Droidspaces RootFS Automated Build
          Build Time: $BUILD_TIME
          Build Target (User Specified): $BUILD_TARGET
          Build ID: $BUILD_ID

          Build Options:
          - **Custom Username**: $CUSTOM_USERNAME
          - **Desktop**: $DESKTOP
          - **Desktop auto-start**: $DESKTOP_AUTOSTART
          - **Display backend**: $DISPLAY_BACKEND
          - Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY
          - PulseAudio Audio Forwarding: $PULSE_AUDIO
          - Anland audio note: Wayland mode uses the built-in Anland app audio, so PulseAudio is not needed
          - nosnap: $ENABLE_NOSNAP
          - systemd 257 old-kernel compatibility: $ENABLE_SYSTEMD257
          - Use Chinese as Primary Language: $ENABLE_ZH_TZ
          - Qualcomm Snapdragon GPU Support: $ENABLE_MESA
          - Fix Snapdragon 8 Gen 2 Wayland display corruption: $ENABLE_8GEN2_WAYLAND
          - Input Method Fcitx 5 Support: $ENABLE_FCITX5
          - Cross-architecture Support: $ENABLE_BINFMT
          - Container Hardware and Network Recognition Support: $ENABLE_HARDWARE
          - Development Tools Integration: $ENABLE_DEV_TOOLS
          - Compression Tools Integration: $ENABLE_COMPRESSION
          - Docker Integration: $ENABLE_DOCKER
          EOF
          fi

      - name: ${{ inputs.ui_language == 'zh' && '创建草稿 Release 并上传文件' || 'Stage draft Release and upload assets' }}
        id: stage-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.build_id }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.ui_language == 'zh' && format('Droidspaces 根文件系统 {0}', needs.setup.outputs.build_id) || format('Droidspaces RootFS {0}', needs.setup.outputs.build_id) }}
          files: "release_assets/*"
          body_path: release-notes.md

          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: ${{ inputs.ui_language == 'zh' && '发布已验证的 Release' || 'Publish staged Release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.stage-release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
          UI_LANGUAGE: ${{ inputs.ui_language }}
        run: |
          set -euo pipefail
          case "$RELEASE_ID" in
            ''|*[!0-9]*)
              if [ "$UI_LANGUAGE" = zh ]; then
                echo "Release 操作没有返回有效的草稿 Release ID。" >&2
              else
                echo "Release action did not return a valid draft Release ID." >&2
              fi
              exit 1
              ;;
          esac
          gh api \
            --method PATCH \
            "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            --silent
