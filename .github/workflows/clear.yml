name: 清理 GitHub 历史数据

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 YES 才执行删除"
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"

      keep_releases:
        description: "保留最新 Releases 数量"
        required: true
        type: string
        default: "3"

      keep_runs:
        description: "保留最新 Actions Runs 数量"
        required: true
        type: string
        default: "10"

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: 安全检查
        env:
          CONFIRM: ${{ inputs.confirm }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
          KEEP_RUNS: ${{ inputs.keep_runs }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "YES" ]; then
            echo "未输入 YES，终止执行"
            exit 1
          fi
          case "$KEEP_RELEASES" in
            ''|*[!0-9]*) echo "保留 Releases 数量必须是非负整数" >&2; exit 1 ;;
          esac
          case "$KEEP_RUNS" in
            ''|*[!0-9]*) echo "保留 Actions Runs 数量必须是非负整数" >&2; exit 1 ;;
          esac
          if [ "${#KEEP_RELEASES}" -gt 5 ] || [ "$KEEP_RELEASES" -gt 10000 ]; then
            echo "保留 Releases 数量不能超过 10000" >&2
            exit 1
          fi
          if [ "${#KEEP_RUNS}" -gt 5 ] || [ "$KEEP_RUNS" -gt 10000 ]; then
            echo "保留 Actions Runs 数量不能超过 10000" >&2
            exit 1
          fi

      - name: 安装 jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 删除旧 Release 和标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: ${{ github.event.inputs.keep_releases }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "获取 Releases..."

          gh api "repos/$REPO/releases?per_page=100" \
            --paginate \
            --slurp \
            > release-pages.json

          COUNT="$(jq '[.[][]] | length' release-pages.json)"

          echo "总 Releases: $COUNT"

          jq -r '[.[][]] | sort_by(.published_at // .created_at) | reverse | .[] | [(.id | tostring), .tag_name, (.draft | tostring)] | @tsv' release-pages.json \
            > releases.txt

          INDEX=0

          while IFS=$'\t' read -r ID TAG DRAFT; do
            if [ "$TAG" = "droidspaces-rootfs-all-wayland" ]; then
              echo "保留固定 RootFS Release: $TAG"
              continue
            fi
            if [ "$DRAFT" = "true" ]; then
              echo "保留尚未发布的 Draft Release: $TAG"
              continue
            fi

            INDEX=$((INDEX + 1))
            if [ "$INDEX" -le "$KEEP_RELEASES" ]; then
              echo "保留 Release: $TAG"
              continue
            fi
            echo "删除 Release: $TAG"

            gh api \
              --method DELETE \
              "repos/$REPO/releases/$ID"

            echo "删除 Tag: $TAG"

            gh api \
              --method DELETE \
              "repos/$REPO/git/refs/tags/$TAG" \
              || true

          done < releases.txt

          echo "删除没有对应 Release 的孤立 Tag..."
          gh api "repos/$REPO/git/matching-refs/tags?per_page=100" \
            --paginate \
            --jq '.[].ref | sub("^refs/tags/"; "")' \
            | sort -u > repository-tags.txt
          gh api "repos/$REPO/releases?per_page=100" \
            --paginate \
            --jq '.[].tag_name' \
            | sort -u > release-tags.txt

          release_exists_for_tag() {
            local tag="$1"

            if ! gh api "repos/$REPO/releases?per_page=100" \
              --paginate \
              --jq '.[].tag_name' \
              > live-release-tags.txt; then
              echo "实时获取 Release 列表失败，拒绝删除 Tag: $tag" >&2
              return 2
            fi

            if grep -Fqx -- "$tag" live-release-tags.txt; then
              return 0
            fi
            return 1
          }

          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue
            if grep -Fqx -- "$TAG" release-tags.txt; then
              echo "保留有对应 Release 的 Tag: $TAG"
              continue
            fi
            if release_exists_for_tag "$TAG"; then
              echo "保留刚创建 Release 的 Tag: $TAG"
              continue
            else
              STATUS=$?
              if [ "$STATUS" -ne 1 ]; then
                exit "$STATUS"
              fi
            fi
            echo "删除孤立 Tag: $TAG"
            gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG"
          done < repository-tags.txt

      - name: 删除旧工作流记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RUNS: ${{ github.event.inputs.keep_runs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "获取 workflow runs..."

          gh api "repos/$REPO/actions/runs?per_page=100" \
            --paginate \
            --slurp \
            > run-pages.json

          jq -r '[.[].workflow_runs[]] | sort_by(.created_at) | reverse | .[] | .id' run-pages.json \
            > runs.txt

          INDEX=0

          while read -r RUN_ID; do
            INDEX=$((INDEX + 1))

            if [ "$RUN_ID" = "$GITHUB_RUN_ID" ]; then
              echo "保留当前 Cleanup Run: $RUN_ID"
              continue
            fi

            if [ "$INDEX" -le "$KEEP_RUNS" ]; then
              echo "保留 Run: $RUN_ID"
              continue
            fi

            echo "删除 Run: $RUN_ID"

            gh api \
              --method DELETE \
              "repos/$REPO/actions/runs/$RUN_ID" \
              || true

          done < runs.txt
