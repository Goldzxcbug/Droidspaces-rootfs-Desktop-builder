# Without a working RTKit service, the Realtime portal may return a zero
# RTTimeUSecMax. PipeWire clients then set RLIMIT_RTTIME=0 and get SIGKILL.
# Skip this portal path; keep direct scheduling and RTKit fallback enabled.
# https://github.com/flatpak/xdg-desktop-portal/issues/2110
# https://github.com/flatpak/xdg-desktop-portal/pull/2139
module.rt.args = {
    rtportal.enabled = false
}
