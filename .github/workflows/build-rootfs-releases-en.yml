name: Build and Release Droidspaces fnOS RootFS

on:
  workflow_dispatch:
    inputs:
      enable_zh_tz:
        description: Use Chinese language and Asia/Shanghai timezone
        required: true
        type: boolean
        default: true
      enable_mesa:
        description: Enable Qualcomm Snapdragon GPU and VA-API hardware decode/encode support
        required: true
        type: boolean
        default: true
      enable_yj:
        description: Enable NAT and hardware recognition
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build fnOS
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: en
      build_target: fnOS
      custom_username: Gold
      desktop: none
      extra_desktops: ""
      desktop_autostart: false
      display_backend: x11
      PulseAudio: none
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      enable_mesa: ${{ inputs.enable_mesa }}
      enable_8gen2_wayland: false
      nosnap: false
      enable_systemd257: false
      enable_srf: false
      enable_binfmt: false
      enable_yj: ${{ inputs.enable_yj }}
      enable_kfgj: false
      enable_zip: false
      enable_docker: false
      wayland_package_repository: Goldzxcbug/droidspaces-package
