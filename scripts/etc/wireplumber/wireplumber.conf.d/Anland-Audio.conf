# Ignore Qualcomm Android camera-control and video-codec interfaces in the V4L2 monitor.
# These are not ordinary V4L2 capture devices; probing them can stall WirePlumber
# device activation and prevent audio streams from being linked.
# Match sysfs identity instead of /dev/videoN so numbering changes do not matter.
# Anland's PipeWire camera sources and ordinary USB/libcamera devices are unaffected.
# WirePlumber 0.5.16/0.5.17 require the upstream disabled-device transition fix.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.sysfs.path = "~^/devices/platform/(.*/)?[^/]*qcom,(cam-req-mgr|cam-sync|vidc)/video4linux/video[0-9]+$"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
