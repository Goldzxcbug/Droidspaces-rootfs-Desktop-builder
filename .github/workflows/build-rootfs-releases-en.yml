name: Build and Release Droidspaces RootFS

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Distribution to build
        required: true
        type: choice
        default: Debian-13
        options:
          - Debian-13
          - Ubuntu-24
          - Ubuntu-25
          - Ubuntu-26
          - Fedora-43
          - Fedora-44
          - Fedora-45
          - Arch
          - all
          - all-wayland
      custom_username:
        description: Custom username
        required: false
        type: string
        default: Gold
      desktop:
        description: Primary desktop (the one that autostarts)
        required: true
        type: choice
        default: KDE
        options:
          - none
          - KDE
          - KDE mobile
          - GNOME
          - Anland Next
          - Niri
          - Hyprland
          - Mango
          - Denial
      extra_desktops:
        description: "Extra desktops, comma-separated (e.g. Niri,Hyprland)"
        required: false
        type: string
        default: ""
      desktop_autostart:
        description: Start desktop on boot (auto-disabled when desktop is none)
        required: true
        type: boolean
        default: true
      display_backend:
        description: Display backend (Fedora 45 KDE, Arch KDE and KDE mobile/GNOME/Anland Next/Niri/Hyprland/Mango/Denial always use Anland Wayland)
        required: true
        type: choice
        default: x11
        options:
          - x11
          - anland-wayland
      PulseAudio:
        description: PulseAudio forwarding
        required: true
        type: choice
        default: socket
        options:
          - socket
          - tcp
          - none
      enable_zh_tz:
        description: Use Chinese language and Asia/Shanghai timezone
        required: true
        type: boolean
        default: false
      enable_mesa:
        description: Enable Qualcomm Snapdragon GPU support
        required: true
        type: boolean
        default: true
      enable_8gen2_wayland:
        description: Fix Snapdragon 8 Gen 2 Wayland corruption
        required: true
        type: boolean
        default: false
      nosnap:
        description: Remove Ubuntu Snap
        required: true
        type: boolean
        default: false
      enable_systemd257:
        description: Use the systemd 257 package family (none and standard KDE only)
        required: true
        type: boolean
        default: false
      enable_srf:
        description: Enable fcitx5
        required: true
        type: boolean
        default: false
      enable_binfmt:
        description: Enable cross-architecture support
        required: true
        type: boolean
        default: false
      enable_yj:
        description: Enable NAT and hardware recognition
        required: true
        type: boolean
        default: true
      enable_kfgj:
        description: Install development tools
        required: true
        type: boolean
        default: false
      enable_zip:
        description: Install compression tools
        required: true
        type: boolean
        default: true
      enable_docker:
        description: Install Docker
        required: true
        type: boolean
        default: false
      wayland_package_repository:
        description: Wayland package repository (public owner/repository)
        required: true
        type: string
        default: Goldzxcbug/droidspaces-package

permissions:
  contents: write

jobs:
  wait-for-fedora45-assets:
    name: Wait for Fedora 45 packages
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_REPO: Goldzxcbug/droidspaces-package
      ANLAND_RUN: '44496822160'
      HYPRLAND_RUN: '44499217674'
      TUI_RUN: '44496822056'
      MESA_RUN: '44495865734'
      TUI_REVISION: 7c148a70b3fa3a2b7c5b20f73c739e17f2cf5f31
    steps:
      - name: Check the rolling release manifests
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$PACKAGE_REPO/releases/download"
          download() {
            curl -fsSL --connect-timeout 10 --max-time 25 "$base/$1/$2"
          }

          completed_checks=0
          deadline=$((SECONDS + 19800))
          while (( SECONDS < deadline )); do
            pending=()
            for family in kde gnome niri hyprland mango denial; do
              expected_run="$ANLAND_RUN"
              if [[ "$family" == hyprland ]]; then
                expected_run="$HYPRLAND_RUN"
              fi
              if ! manifest="$(download "anland-$family-packages" "anland-$family-manifest")" ||
                 ! grep -Eq "^revision=run-${expected_run}-[0-9]+$" <<< "$manifest" ||
                 ! grep -q '^fedora45=' <<< "$manifest"; then
                pending+=("anland-$family")
              fi
            done

            if ! manifest="$(download Gold-bug-tui Gold-bug-tui-manifest)" ||
               ! grep -Fxq "revision=$TUI_REVISION" <<< "$manifest"; then
              pending+=(tui)
            fi

            if ! manifest="$(download mesa-for-android-container mesa-distribution-manifest)" ||
               ! grep -Eq '_fedora_45_arm64\.tar\.gz$' <<< "$manifest"; then
              pending+=(mesa)
            fi

            if (( ${#pending[@]} == 0 )); then
              echo 'Fedora 45 artifacts are ready.'
              exit 0
            fi

            printf 'Waiting for %s\n' "${pending[*]}"
            all_completed=true
            for run_id in "$ANLAND_RUN" "$HYPRLAND_RUN" "$TUI_RUN" "$MESA_RUN"; do
              if ! state="$(gh run view "$run_id" --repo "$PACKAGE_REPO" \
                --json status,conclusion --jq '[.status,.conclusion] | join(":")')"; then
                all_completed=false
                continue
              fi
              case "$state" in
                completed:success) ;;
                completed:*)
                  # Hyprland was retried separately. The other five families are checked individually above.
                  if [[ "$run_id" == "$ANLAND_RUN" && "$state" == completed:failure ]]; then
                    continue
                  fi
                  echo "Dependency run $run_id ended with ${state#*:}."
                  exit 1
                  ;;
                *) all_completed=false ;;
              esac
            done

            if [[ "$all_completed" == true ]]; then
              completed_checks=$((completed_checks + 1))
              if (( completed_checks >= 8 )); then
                echo 'The dependency runs completed but the expected Fedora 45 assets are missing.'
                exit 1
              fi
            fi
            sleep 45
          done

          echo 'Timed out waiting for Fedora 45 assets.'
          exit 1

  build:
    needs: wait-for-fedora45-assets
    name: Build
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: en
      build_target: ${{ inputs.build_target }}
      custom_username: ${{ inputs.custom_username }}
      desktop: ${{ inputs.desktop }}
      extra_desktops: ${{ inputs.extra_desktops }}
      desktop_autostart: ${{ inputs.desktop_autostart }}
      display_backend: ${{ inputs.display_backend }}
      PulseAudio: ${{ inputs.PulseAudio }}
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      enable_mesa: ${{ inputs.enable_mesa }}
      enable_8gen2_wayland: ${{ inputs.enable_8gen2_wayland }}
      nosnap: ${{ inputs.nosnap }}
      enable_systemd257: ${{ inputs.enable_systemd257 }}
      enable_srf: ${{ inputs.enable_srf }}
      enable_binfmt: ${{ inputs.enable_binfmt }}
      enable_yj: ${{ inputs.enable_yj }}
      enable_kfgj: ${{ inputs.enable_kfgj }}
      enable_zip: ${{ inputs.enable_zip }}
      enable_docker: ${{ inputs.enable_docker }}
      wayland_package_repository: ${{ inputs.wayland_package_repository }}
      publish_release: false
